[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geometry-dash-rl"
version = "0.1.0"
description = "A reproducible pixel-based reinforcement-learning environment for Geometry Dash."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.2,<2",
    "mss>=10,<11",
    "numpy>=2,<3",
    "pillow>=11,<13",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/KuantumKnight/geometry-dash-rl-ai-agent"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "coverage==7.15.4",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "pyright==1.1.411",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geometry_dash_env"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D102", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D107"]
"tools/**" = ["D102", "D107"]

[tool.uv]
package = true

[tool.coverage.run]
branch = true
source = ["src/geometry_dash_env"]
omit = ["*/platform_control.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
